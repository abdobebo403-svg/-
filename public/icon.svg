<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe-zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle Islamic star border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="206" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="6,6" />

  <!-- Quran Rehal (Stand) & Book Base -->
  <g filter="url(#goldGlow)" transform="translate(256, 256)">
    <!-- Lower Rehal legs -->
    <path d="M -80 90 L -120 150 L -90 150 L -50 90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 80 90 L 120 150 L 90 150 L 50 90 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M -90 145 L 90 145" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" opacity="0.6" />

    <!-- Open Book Pages Left and Right -->
    <!-- Left Page -->
    <path d="M -8 75 C -50 78 -130 55 -150 -10 C -150 -60 -110 -75 -8 -50 Z" 
          fill="#fbfbfa" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M -12 -42 C -90 -62 -135 -48 -135 -5 C -120 48 -50 68 -12 65" 
          fill="none" stroke="#e5e7eb" stroke-width="2" />
    <line x1="-125" y1="-5" x2="-35" y2="-5" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />
    <line x1="-120" y1="15" x2="-40" y2="15" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />
    <line x1="-110" y1="35" x2="-45" y2="35" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />

    <!-- Right Page -->
    <path d="M 8 75 C 50 78 130 55 150 -10 C 150 -60 110 -75 8 -50 Z" 
          fill="#fbfbfa" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M 12 -42 C 90 -62 135 -48 135 -5 C 120 48 50 68 12 65" 
          fill="none" stroke="#e5e7eb" stroke-width="2" />
    <line x1="35" y1="-5" x2="125" y2="-5" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />
    <line x1="40" y1="15" x2="120" y2="15" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />
    <line x1="45" y1="35" x2="110" y2="35" stroke="#9ca3af" stroke-width="3" stroke-linecap="round" />

    <!-- Center Binding Spine & Ribbon -->
    <path d="M 0 -55 L 0 85" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" />
    <path d="M 0 85 C 10 110 25 125 35 140" fill="none" stroke="#dc2626" stroke-width="4" stroke-linecap="round" />

    <!-- Upper Crescent and Star -->
    <g transform="translate(0, -90) scale(0.65)">
      <path d="M 12 -28 A 32 32 0 1 0 12 36 A 25 25 0 1 1 12 -28 Z" fill="url(#goldGrad)" />
      <polygon points="12,-4 17,6 28,6 19,13 22,23 12,17 3,23 6,13 -3,6 8,6" fill="url(#goldGrad)" />
    </g>
  </g>
</svg>
